name: Candidate checks
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  browser-workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BACKEND_SHA: e670520e2e9bf295a734edc4ef7dc5acfe7bbd7f
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: eman-java-dev/OlympicNutritionTracker-Backend
          ref: ${{ env.BACKEND_SHA }}
          path: .ci-backend
          persist-credentials: false
      - name: Verify pinned backend
        run: test "$(git -C .ci-backend rev-parse HEAD)" = "$BACKEND_SHA"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build:e2e
      - name: Run the five browser workflows against disposable MySQL
        run: bash .github/scripts/browser-ci.sh
      - name: Remove any remaining fixture container and browser results
        if: always()
        run: |
          docker rm -f -v "olympic-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >/dev/null 2>&1 || :
          rm -rf -- .ci-backend test-results playwright-report

  secret-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify and run Gitleaks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.after }}
        run: |
          set -euo pipefail
          range=$(bash .github/scripts/secret-range.sh "$BASE_SHA" "$HEAD_SHA")
          archive=gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --show-error --silent --location --output "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$archive"
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$RUNNER_TEMP/$archive" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          control=$(mktemp -d)
          trap 'rm -rf -- "$control"' EXIT
          printf 'synthetic_test_key=ghp_%s\n' "$(openssl rand -hex 18)" > "$control/synthetic.txt"
          status=0
          "$RUNNER_TEMP/gitleaks" dir --redact=100 --no-banner --exit-code=42 "$control" > /dev/null 2>&1 || status=$?
          test "$status" -eq 42
          "$RUNNER_TEMP/gitleaks" git --redact=100 --no-banner --log-opts="$range"


  code-analysis:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@800a1d8701a65d150a672fef0923dbf2660a62ec # v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@800a1d8701a65d150a672fef0923dbf2660a62ec # v4
