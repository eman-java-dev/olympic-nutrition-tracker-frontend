<nav class="nav" role="navigation" aria-label="Main">
  <div class="container nav-inner">
    <a class="brand shine" routerLink="/home">
      {{ t('brand') }}
    </a>

    <div class="menu" role="menubar" *ngIf="auth.isAuthenticated()">
      <a class="shine" routerLink="/home">Accueil</a>
      <a class="shine" routerLink="/athletes">Athlètes</a>
      <a class="shine" routerLink="/nutrition">Nutrition</a>
      <a class="shine" routerLink="/consultations">Consultations</a>
      <a class="shine" routerLink="/coaches">Coachs</a>
    </div>

    <div style="display:flex; gap:8px; align-items:center">
      <button class="btn btn-ghost" type="button" (click)="switch('en')" [disabled]="current() === 'en'">
        EN
      </button>

      <button class="btn btn-ghost" type="button" (click)="switch('fr')" [disabled]="current() === 'fr'">
        FR
      </button>

      <span *ngIf="auth.isAuthenticated()" style="color:var(--muted); font-size:13px;">
        {{ auth.currentUser()?.username }} - {{ auth.currentUser()?.role }}
      </span>

      <a *ngIf="!auth.isAuthenticated()" class="btn btn-primary shine" routerLink="/signin">
        Se connecter
      </a>

      <button *ngIf="auth.isAuthenticated()" class="btn btn-danger shine" type="button" (click)="logout()">
        Déconnexion
      </button>
    </div>
  </div>
</nav>

<router-outlet></router-outlet>

<footer class="footer" role="contentinfo">
  <div class="container">© {{ year }} {{ t('brand') }}</div>
</footer>
