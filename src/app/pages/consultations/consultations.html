<section class="hero" style="height:40vh; border-bottom-left-radius:24px; border-bottom-right-radius:24px; overflow:hidden;">
  <video autoplay muted loop playsinline class="hero-video">
    <source src="assets/side.mp4" type="video/mp4" />
  </video>

  <div class="hero-overlay">
    <div class="container">
      <span class="kicker">CONSULTATIONS</span>
      <h1>Planifier et suivre les consultations entre coachs et athlètes.</h1>
    </div>
  </div>
</section>

<section class="section">
  <div class="container">

    <div *ngIf="error()" class="card" style="margin-bottom:12px; border-color:#ff4d4f;">
      <div class="card-body" style="color:#ff4d4f;">
        {{ error() }}
      </div>
    </div>

    <form
      #f="ngForm"
      (ngSubmit)="save(f)"
      class="consultation-form"
    >
      <input
        class="input"
        type="datetime-local"
        name="scheduledAt"
        [(ngModel)]="model.scheduledAt"
        required
      />

      <select
        class="input"
        name="athleteId"
        [(ngModel)]="model.athleteId"
        required
      >
        <option [ngValue]="undefined">Athlète</option>
        <option *ngFor="let a of athletes()" [ngValue]="a.id">
          {{ a.name }}
        </option>
      </select>

      <select
        class="input"
        name="coachId"
        [(ngModel)]="model.coachId"
        required
      >
        <option [ngValue]="undefined">Coach</option>
        <option *ngFor="let c of coaches()" [ngValue]="c.id">
          {{ c.name }}
        </option>
      </select>

      <input
        class="input"
        type="text"
        name="message"
        [(ngModel)]="model.message"
        placeholder="Message"
        required
      />

      <button class="btn btn-primary shine" type="submit" [disabled]="loading()">
        {{ editingId() ? 'Mettre à jour' : 'Ajouter' }}
      </button>
    </form>

    <div style="height:12px"></div>

    <button
      class="btn btn-ghost shine"
      type="button"
      (click)="loadPageData()"
      [disabled]="loading()"
      style="margin-bottom:12px;"
    >
      Rafraîchir
    </button>

    <div class="card">
      <div class="card-body">

        <div *ngIf="loading()" style="padding:12px; color:var(--muted)">
          Chargement...
        </div>

        <table class="table consultation-table" *ngIf="!loading()">
          <thead>
            <tr>
              <th>#</th>
              <th>Date</th>
              <th>Message</th>
              <th>Athlète</th>
              <th>Coach</th>
              <th>Actions</th>
            </tr>
          </thead>

          <tbody>
            <tr *ngFor="let c of list(); let i = index">
              <td>{{ i + 1 }}</td>

              <td>
                {{ c.scheduledAt | date:'dd/MM/yyyy HH:mm' }}
              </td>

              <td class="message-cell">
                {{ c.message || '—' }}
              </td>

              <td>
                {{ getAthleteName(c) }}
              </td>

              <td>
                {{ getCoachName(c) }}
              </td>

              <td>
                <div style="display:flex; gap:10px; align-items:center;">
                  <button
                    class="btn btn-edit shine"
                    type="button"
                    (click)="startEdit(c)"
                  >
                    Modifier
                  </button>

                  <button
                    class="btn btn-danger shine"
                    type="button"
                    (click)="remove(c.id)"
                  >
                    Supprimer
                  </button>
                </div>
              </td>
            </tr>

            <tr *ngIf="!list().length">
              <td colspan="6" style="text-align:center; padding:16px; color:var(--muted)">
                Pas de données.
              </td>
            </tr>
          </tbody>
        </table>

      </div>
    </div>

  </div>
</section>
