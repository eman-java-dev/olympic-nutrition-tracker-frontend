<section class="signin-hero">
  <div class="page-bg"></div>

  <div class="container">
    <div class="brandline">
      <div class="logo">NT</div>
      <div class="brandtext">Nutrition <span>Tracker</span></div>
    </div>

    <article
      class="signin-card"
      (mousemove)="onMove($event)"
      (mouseleave)="onLeave()"
      style="--rx:0deg; --ry:0deg;"
    >
      <span class="kicker">{{ t('brand') }}</span>

      <h1>{{ t('auth.title') }}</h1>

      <p class="lead">
        {{ t('auth.lead') }}
      </p>

      <div
        *ngIf="error || sessionMessage as message"
        role="alert"
        class="card"
        style="margin-bottom:14px; border-color:#ff4d4f;"
      >
        <div class="card-body" style="color:#ff4d4f; padding:12px;">
          {{ t(message) }}
        </div>
      </div>

      <form #f="ngForm" (ngSubmit)="login(f)" class="signin-form" novalidate>
        <label class="label" for="username">
          {{ t('auth.username') }}
        </label>

        <input
          id="username"
          class="input"
          type="text"
          name="username"
          [(ngModel)]="username"
          autocomplete="username"
          required
        />

        <label class="label" for="password">
          {{ t('auth.password') }}
        </label>

        <input
          id="password"
          class="input"
          type="password"
          name="password"
          [(ngModel)]="password"
          autocomplete="current-password"
          required
        />

        <div class="actions">
          <button
            type="submit"
            class="btn btn-primary"
            [disabled]="loading || !f.valid"
          >
            <span class="btn-content">
              <span
                *ngIf="loading"
                class="spinner"
                aria-hidden="true"
              ></span>

              {{ t(loading ? 'auth.loading' : 'auth.login') }}
            </span>
          </button>

          <button
            type="button"
            class="btn btn-ghost"
            (click)="back()"
            [disabled]="loading || !canGoBack"
          >
            {{ t('auth.back') }}
          </button>
        </div>

      </form>
    </article>
  </div>
</section>
